# Remote MCP endpoint for mobileproxy.space. See deploy/README.md.
# Put MOBILEPROXY_OAUTH_SECRET into a .env file next to this one (openssl rand -hex 32).
services:
  mcp:
    image: ghcr.io/mobileproxy/mcp-server:latest
    command: ["--http"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      MOBILEPROXY_PUBLIC_URL: https://mcp.mpsapi.com
      MOBILEPROXY_TRUST_PROXY: "1"
      MOBILEPROXY_OAUTH_SECRET: ${MOBILEPROXY_OAUTH_SECRET:?set MOBILEPROXY_OAUTH_SECRET in deploy/.env}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
