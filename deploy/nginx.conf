# /etc/nginx/sites-available/mcp.mobileproxy.space
# Start with this HTTP-only block, then run:
#   certbot --nginx -d mcp.mobileproxy.space --redirect
# certbot adds the 443 listener, the certificate and the HTTP→HTTPS redirect itself.
server {
    listen 80;
    server_name mcp.mobileproxy.space;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # The server checks the Host header (DNS rebinding protection) against MOBILEPROXY_PUBLIC_URL.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Some tools (rotate_until_clean) run for up to a minute.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
