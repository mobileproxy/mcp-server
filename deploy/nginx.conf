# /etc/nginx/sites-available/mcp.mobileproxy.space
server {
    listen 80;
    server_name mcp.mobileproxy.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.mobileproxy.space;

    ssl_certificate     /etc/letsencrypt/live/mcp.mobileproxy.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.mobileproxy.space/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # The server checks the Host header (DNS rebinding protection) against MOBILEPROXY_PUBLIC_URL.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Some tools (rotate_until_clean) run for up to a minute.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
